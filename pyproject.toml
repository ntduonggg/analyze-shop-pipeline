[project]
name = "analyze-shop"
version = "0.1.0"
description = "Crawl Everbee shop/listing data and analyze custom-gift fit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "requests>=2.33.1",
]

[project.optional-dependencies]
# Chỉ dùng trên host cho scripts/get_token.py (cần trình duyệt Edge)
token = ["selenium>=4.44.0"]

[project.scripts]
scrape = "analyze_shop.scraper.scrape:main"
analyzer = "analyze_shop.analyzer.gift_fit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyze_shop"]
